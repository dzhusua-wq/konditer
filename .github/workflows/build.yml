name: Збірка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Завантажити модель розпізнавання (MobileNetV3, ~4 МБ)
        run: |
          mkdir -p app/src/main/assets
          curl -L -f -o app/src/main/assets/mobilenet_v3_small.tflite \
            https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/latest/mobilenet_v3_small.tflite
          ls -la app/src/main/assets

      - name: Зібрати APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Перейменувати
        run: cp app/build/outputs/apk/release/app-release.apk Konditer-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Konditer-${{ github.run_number }}
          path: Konditer-${{ github.run_number }}.apk

      - name: Опублікувати в Releases (зручно качати з телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Кондитер ${{ github.run_number }}
          files: Konditer-${{ github.run_number }}.apk
